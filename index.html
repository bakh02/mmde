<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#222222">
<title>MagSafe Mobile Data Extractor</title>
<style>
  :root{
    --bg:#222222; 
    --fg:#ffffff;
    --sub:#9a9a9a;
    --btn:#0078D7;
    --btn-active:#005A9E;
    --btn-disabled:#3a3a3a;
    --field:#1c1c1c;
    --log-bg:#111111;
    --log-fg:#4ade80; 
    --border:#3d3d3d;
    --accent:#33c3ff;
    --btn-cancel: #d32f2f;
    --btn-cancel-active: #b71c1c;
  }
  
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  
  body {
    height: 100dvh; 
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
  }

  /* --- Управление экранами --- */
  .screen {
    display: none; 
    flex: 1; 
    flex-direction: column;
    min-height: 0;
    padding: 20px;
    width: 100%;
    max-width: 500px; 
    margin: 0 auto;   
  }
  .screen.active {
    display: flex;
  }

  /* ---------- ЭКРАН ЗАГРУЗКИ ---------- */
  /* Переносим градиент на body через псевдокласс, чтобы он был на весь экран */
  body.loading-bg {
    background: radial-gradient(circle at 50% 40%, #303030 0%, #1a1a1a 100%);
  }

  #screen-loader {
    align-items: center; 
    justify-content: center; 
    text-align: center;
    background: transparent; /* Убираем фон с самого блока */
    max-width: 100%;
  }
  #screen-loader .brand {
    font-size: 14px; letter-spacing: 3px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 14px; opacity: .9; font-weight: 600;
  }
  #screen-loader h1 { 
    font-size: 24px; margin: 0 0 40px; font-weight: 700; letter-spacing: .5px; 
  }
  
  .loader-svg { width: 260px; height: 140px; margin-bottom: 40px; }
  .loader-svg .packet { animation: packetMove 1.6s linear infinite; }
  .loader-svg .packet.p2 { animation-delay: .53s; }
  .loader-svg .packet.p3 { animation-delay: 1.06s; }
  @keyframes packetMove {
    0% { transform: translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateX(70px); opacity: 0; }
  }
  
  .loader-bar {
    width: 260px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 16px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .loader-bar-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #0078D7, #33c3ff); transition: width .1s linear;
  }
  .loader-status { font-size: 14px; color: var(--sub); min-height: 20px; font-weight: 500; }

  /* ---------- ЭКРАН 1 (ПОДКЛЮЧЕНИЕ) ---------- */
  #screen-start { align-items: center; justify-content: center; text-align: center; }
  #screen-start h1 { font-size: 24px; margin: 0 0 16px; line-height: 1.3; }
  #screen-start p { color: var(--sub); font-size: 16px; margin: 0 0 48px; max-width: 300px; line-height: 1.5; }

  /* ---------- ОБЩИЕ КНОПКИ ---------- */
  button {
    font-family: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 14px;
    color: #fff; background: var(--btn); padding: 18px 20px;
    width: 100%; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0, 120, 215, 0.3);
  }
  button:active { background: var(--btn-active); transform: scale(0.97); }
  button:disabled { background: var(--btn-disabled); color: #777; cursor: not-allowed; box-shadow: none; transform: none; }

  /* Спец. кнопка отмены */
  #cancel-btn {
    display: none; /* Скрыта по умолчанию */
    background: var(--btn-cancel);
    box-shadow: 0 4px 16px rgba(211, 47, 47, 0.3);
    margin-top: 12px;
  }
  #cancel-btn:active { background: var(--btn-cancel-active); }

  /* ---------- ЭКРАН 2 (ВЫБОР И ПРОЦЕСС) ---------- */
  #screen-select h2 { font-size: 20px; margin: 0 0 24px; text-align: center; font-weight: 600; flex-shrink: 0; }
  
  .field { margin-bottom: 18px; flex-shrink: 0; }
  .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
  select {
    width: 100%; font-size: 16px; color: var(--fg); background: var(--field);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 16px;
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='10'><path d='M1 1l6 6 6-6' stroke='%239a9a9a' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center;
  }
  select:disabled { opacity: 0.5; }
  select:focus { outline: none; border-color: var(--btn); }

  #action-btn { height: 76px; font-size: 16px; margin: 10px 0 24px; line-height: 1.3; }

  /* --- ЛОГ --- */
  .log-wrap {
    display: flex; flex-direction: column;
    flex-grow: 1; /* Заставляет лог занять всё свободное место */
    margin-bottom: 16px;
    min-height: 100px; 
  }
  .log-wrap .caption { font-size: 12px; color: var(--sub); margin-bottom: 8px; flex-shrink: 0; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
  #log {
    flex-grow: 1; 
    background: var(--log-bg); color: var(--log-fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
    font-size: 11px; line-height: 1.6;
    border-radius: 14px; padding: 14px; overflow-y: auto;
    border: 1px solid #2a2a2a;
    white-space: pre-wrap; word-wrap: break-word;
    -webkit-overflow-scrolling: touch;
  }

  /* --- ПРОГРЕСС И НИЗ (ПРИЖАТЫ К САМОМУ НИЗУ) --- */
  .progress-wrap {
    flex-shrink: 0; 
    margin-top: auto; /* Прижимает блок в самый низ */
    width: 100%;
  }
  #bar { width: 100%; height: 14px; background: var(--field); border-radius: 8px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
  #bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0078D7, #33c3ff); transition: width 0.3s linear; }
  #status { font-size: 13px; color: var(--sub); text-align: center; margin-top: 14px; min-height: 38px; line-height: 1.5; font-weight: 500;}
</style>
</head>
<body class="loading-bg">

<!-- ========== ЭКРАН ЗАГРУЗКИ ========== -->
<section id="screen-loader" class="screen active">
  <div class="brand">MagSafe</div>
  <h1>Mobile Data Extractor</h1>

  <svg class="loader-svg" viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="20" width="42" height="76" rx="8" stroke="#555" stroke-width="2"/>
    <rect x="17" y="30" width="28" height="50" rx="3" fill="#111"/>
    <rect x="24" y="86" width="14" height="3" rx="1.5" fill="#555"/>
    <rect x="168" y="20" width="42" height="76" rx="8" stroke="#33c3ff" stroke-width="2"/>
    <rect x="175" y="30" width="28" height="50" rx="3" fill="#0e2a33"/>
    <rect x="182" y="86" width="14" height="3" rx="1.5" fill="#33c3ff"/>
    <line x1="56" y1="58" x2="164" y2="58" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="164,53 172,58 164,63" fill="#333"/>
    <circle class="packet p1" cx="66" cy="58" r="4" fill="#33c3ff"/>
    <circle class="packet p2" cx="66" cy="58" r="3" fill="#0090d0"/>
    <circle class="packet p3" cx="66" cy="58" r="3.5" fill="#66d9ff"/>
  </svg>

  <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
  <div class="loader-status" id="loader-status">Инициализация…</div>
</section>

<!-- ========== ЭКРАН 1 (ПОДКЛЮЧЕНИЕ) ========== -->
<section id="screen-start" class="screen">
  <h1>Подключите мобильное устройство</h1>
  <p>Убедитесь, что кабель подключён, и нажмите кнопку ниже</p>
  <button id="btn-connected">Устройство подключено</button>
</section>

<!-- ========== ЭКРАН 2 (ВЫБОР И ПРОЦЕСС) ========== -->
<section id="screen-select" class="screen">
  <h2>Выберите устройство</h2>

  <div class="field">
    <label for="brand">Марка</label>
    <select id="brand"><option value="">— выберите —</option></select>
  </div>

  <div class="field">
    <label for="model">Модель</label>
    <select id="model" disabled><option value="">— сначала выберите марку —</option></select>
  </div>

  <button id="action-btn" disabled>Создать файл-образ памяти<br>мобильного устройства</button>

  <div class="log-wrap">
    <div class="caption">Протокол копирования:</div>
    <div id="log"></div>
  </div>

  <!-- Блок прижат к низу экрана -->
  <div class="progress-wrap">
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="status">Ожидание выбора модели…</div>
    <button id="cancel-btn">Отмена</button>
  </div>
</section>

<script>
/* ---------- Загрузочная анимация ---------- */
(function runLoader(){
  const fill = document.getElementById("loader-fill");
  const statusEl = document.getElementById("loader-status");
  const stages = [
    { at:0,    text:"Инициализация модулей…" },
    { at:1500, text:"Проверка интерфейсов связи…" },
    { at:2800, text:"Подготовка каналов передачи…" },
    { at:4200, text:"Почти готово…" }
  ];
  const DURATION = 5000;
  const start = performance.now();
  let stageIdx = 0;

  function tick(now){
    const t = Math.min(now - start, DURATION);
    fill.style.width = (t / DURATION * 100).toFixed(1) + "%";
    if(stageIdx < stages.length && t >= stages[stageIdx].at){
      statusEl.textContent = stages[stageIdx].text;
      stageIdx++;
    }
    if(t < DURATION){
      requestAnimationFrame(tick);
    } else {
      document.getElementById("screen-loader").classList.remove("active");
      document.getElementById("screen-start").classList.add("active");
      // Убираем градиент с фона, когда загрузка завершена
      document.body.classList.remove("loading-bg");
    }
  }
  requestAnimationFrame(tick);
})();

/* ---------- Справочник моделей ---------- */
const PHONE_DB = {
  "Apple": [
    "iPhone 16 Pro Max","iPhone 16 Pro","iPhone 16 Plus","iPhone 16","iPhone 16e",
    "iPhone 15 Pro Max","iPhone 15 Pro","iPhone 15 Plus","iPhone 15",
    "iPhone 14 Pro Max","iPhone 14 Pro","iPhone 14 Plus","iPhone 14",
    "iPhone 13 Pro Max","iPhone 13 Pro","iPhone 13","iPhone 13 mini",
    "iPhone SE (3-го поколения)","iPhone 12 Pro Max","iPhone 12 Pro","iPhone 12","iPhone 12 mini",
    "iPhone SE (2-го поколения)","iPhone 11 Pro Max","iPhone 11 Pro","iPhone 11",
    "iPhone XS Max","iPhone XS","iPhone XR","iPhone X",
    "iPhone 8 Plus","iPhone 8","iPhone 7 Plus","iPhone 7",
    "iPhone SE (1-го поколения)","iPhone 6s Plus","iPhone 6s","iPhone 6 Plus","iPhone 6"
  ],
  "Samsung": [
    "Galaxy S25 Ultra","Galaxy S25+","Galaxy S25",
    "Galaxy S24 Ultra","Galaxy S24+","Galaxy S24",
    "Galaxy S23 Ultra","Galaxy S23+","Galaxy S23",
    "Galaxy S22 Ultra","Galaxy S22+","Galaxy S22",
    "Galaxy S21 Ultra","Galaxy S21+","Galaxy S21",
    "Galaxy S20 Ultra","Galaxy S20+","Galaxy S20",
    "Galaxy Note 20 Ultra","Galaxy Note 20","Galaxy Note 10+","Galaxy Note 10",
    "Galaxy Z Fold 7","Galaxy Z Fold 6","Galaxy Z Fold 5","Galaxy Z Fold 4","Galaxy Z Fold 3",
    "Galaxy Z Flip 7","Galaxy Z Flip 6","Galaxy Z Flip 5","Galaxy Z Flip 4","Galaxy Z Flip 3",
    "Galaxy A56","Galaxy A55","Galaxy A54","Galaxy A36","Galaxy A35","Galaxy A34",
    "Galaxy A26","Galaxy A25","Galaxy A16","Galaxy A15"
  ],
  "Xiaomi": [
    "Xiaomi 15 Ultra","Xiaomi 15 Pro","Xiaomi 15","Xiaomi 15T Pro","Xiaomi 15T",
    "Xiaomi 14 Ultra","Xiaomi 14 Pro","Xiaomi 14","Xiaomi 14T Pro","Xiaomi 14T",
    "Xiaomi 13 Ultra","Xiaomi 13 Pro","Xiaomi 13","Xiaomi 13T Pro","Xiaomi 13T",
    "Xiaomi 12 Pro","Xiaomi 12","Xiaomi 12T Pro","Xiaomi 12T",
    "Redmi Note 14 Pro+","Redmi Note 14 Pro","Redmi Note 14",
    "Redmi Note 13 Pro+","Redmi Note 13 Pro","Redmi Note 13",
    "Redmi Note 12 Pro","Redmi Note 12","Redmi Note 11 Pro","Redmi Note 11",
    "Redmi K80 Pro","Redmi K80","Redmi K70 Pro","Redmi K70","Redmi K60 Pro","Redmi K60",
    "POCO X7 Pro","POCO X7","POCO X6 Pro","POCO X6","POCO F6 Pro","POCO F6","POCO F5"
  ],
  "Huawei": [
    "Mate 70 Pro+","Mate 70 Pro","Mate 70","Mate 60 Pro+","Mate 60 Pro","Mate 60",
    "Mate 50 Pro","Mate 50","Mate 40 Pro+","Mate 40 Pro","Mate 40",
    "Mate 30 Pro","Mate 30","Mate 20 Pro","Mate 20","Mate 10 Pro","Mate 10",
    "Pura 70 Ultra","Pura 70 Pro+","Pura 70 Pro","Pura 70",
    "P60 Pro","P60","P50 Pro","P50","P40 Pro+","P40 Pro","P40",
    "P30 Pro","P30","P20 Pro","P20",
    "nova 13 Pro","nova 13","nova 12 Pro","nova 12","nova 11 Pro","nova 11",
    "nova 10 Pro","nova 10","nova 9 Pro","nova 9"
  ]
};

/* ---------- Пути и имена файлов ---------- */
const IOS_DIRS = [
  "/private/var/mobile/Media/DCIM/100APPLE/",
  "/private/var/mobile/Media/DCIM/101APPLE/",
  "/private/var/mobile/Media/PhotoData/CPLAssets/",
  "/private/var/mobile/Media/Recordings/",
  "/private/var/mobile/Library/SMS/Attachments/",
  "/private/var/mobile/Containers/Data/Application/WhatsApp/Documents/",
  "/private/var/mobile/Containers/Data/Application/Telegram/Documents/",
  "/private/var/mobile/Library/Calendar/",
  "/private/var/mobile/Library/Notes/",
  "/private/var/mobile/Library/Voicemail/"
];
const ANDROID_DIRS = [
  "/storage/emulated/0/DCIM/Camera/",
  "/storage/emulated/0/Pictures/Screenshots/",
  "/storage/emulated/0/Download/",
  "/storage/emulated/0/WhatsApp/Media/WhatsApp Images/",
  "/storage/emulated/0/Telegram/Telegram Images/",
  "/storage/emulated/0/Music/",
  "/storage/emulated/0/Movies/",
  "/data/data/com.android.providers.contacts/databases/",
  "/data/data/com.android.providers.telephony/databases/",
  "/data/misc/keystore/"
];
const IOS_EXTS = [".HEIC",".MOV",".JPG",".PNG",".MP4",".plist",".db",".sqlite",".txt",".pdf"];
const ANDROID_EXTS = [".jpg",".mp4",".png",".db",".sqlite",".xml",".json",".apk",".pdf",".webm"];
const ACTIONS = ["чтение","копирование","хэширование","запись в образ"];

const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function randomFilename(brand){
  const isApple = brand === "Apple";
  const base = isApple
    ? pick(["IMG","VID","PXL","RPReplay","VNote","Screenshot"])
    : pick(["IMG","VID","Screenshot","photo","video","doc"]);
  const num = isApple ? String(rnd(1,9999)).padStart(4,"0")
                      : String(rnd(1,99999)).padStart(5,"0");
  return base + "_" + num + pick(isApple?IOS_EXTS:ANDROID_EXTS);
}
function randomPath(brand){
  const dir = brand === "Apple" ? pick(IOS_DIRS) : pick(ANDROID_DIRS);
  return dir + randomFilename(brand);
}
function humanSize(){
  const kb = rnd(12,8000);
  return kb < 1024 ? kb+" KB" : (kb/1024).toFixed(1)+" MB";
}
function pad2(n){ return String(n).padStart(2,"0"); }

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const screenStart = $("screen-start");
const screenSelect = $("screen-select");
const brandSel = $("brand");
const modelSel = $("model");
const actionBtn = $("action-btn");
const cancelBtn = $("cancel-btn");
const logEl = $("log");
const barFill = $("bar-fill");
const statusEl = $("status");

/* ---------- Состояние ---------- */
let isProcessing = false;
let totalMs = 0;
let startTs = 0;
let progressTimer = null;
let logTimer = null;
let wakeLock = null;
const LOG_MAX_LINES = 200;

/* ---------- Инициализация брендов ---------- */
Object.keys(PHONE_DB).forEach(b=>{
  const o = document.createElement("option");
  o.value = b; o.textContent = b;
  brandSel.appendChild(o);
});

/* ---------- Обработчики ---------- */
$("btn-connected").addEventListener("click", ()=>{
  screenStart.classList.remove("active");
  screenSelect.classList.add("active");
});

brandSel.addEventListener("change", ()=>{
  const brand = brandSel.value;
  modelSel.innerHTML = "";
  if(!brand){
    modelSel.disabled = true;
    modelSel.innerHTML = '<option value="">— сначала выберите марку —</option>';
    resetActionBtn();
    return;
  }
  modelSel.disabled = false;
  modelSel.innerHTML = '<option value="">— выберите модель —</option>';
  PHONE_DB[brand].forEach(m=>{
    const o = document.createElement("option");
    o.value = m; o.textContent = m;
    modelSel.appendChild(o);
  });
  resetActionBtn();
  statusEl.textContent = "Выберите модель из списка.";
});

modelSel.addEventListener("change", ()=>{
  if(modelSel.value){
    actionBtn.disabled = false;
    statusEl.textContent = `Готово к созданию образа: ${brandSel.value} ${modelSel.value}`;
  } else {
    resetActionBtn();
  }
});

function resetActionBtn(){
  actionBtn.disabled = true;
  statusEl.textContent = "Ожидание выбора модели…";
}

actionBtn.addEventListener("click", startProcess);

// Обработчик кнопки Отмена
cancelBtn.addEventListener("click", () => {
  const msg = "Вы действительно хотите отменить процедуру копирования? Все скопированные данные будут БЕЗВОЗВРАТНО удалены.";
  if (confirm(msg)) {
    abortProcess();
  }
});

/* ---------- Лог ---------- */
function appendLog(line){
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  logEl.textContent += line + "\n";
  const lines = logEl.textContent.split("\n");
  if(lines.length > LOG_MAX_LINES){
    logEl.textContent = lines.slice(lines.length - LOG_MAX_LINES).join("\n");
  }
  if(atBottom) logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- Процесс ---------- */
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}

function startProcess(){
  if(isProcessing) return;
  if(!brandSel.value || !modelSel.value) return;

  isProcessing = true;
  actionBtn.disabled = true;
  
  // Показываем кнопку отмены
  cancelBtn.style.display = "block";

  logEl.textContent = "";
  barFill.style.width = "0%";

  const minutes = rnd(25, 35);
  totalMs = minutes * 60 * 1000;
  startTs = Date.now();

  appendLog(`[INIT] Начало создания образа: ${brandSel.value} ${modelSel.value}`);
  appendLog(`[INIT] Оценочное время: ~${minutes} мин.`);

  statusEl.textContent = `Создание образа… прогресс 0.0%`;
  requestWakeLock();

  progressTimer = setInterval(updateProgress, 500);
  scheduleLogTick();
}

function scheduleLogTick(){
  if(!isProcessing) return;
  const brand = brandSel.value;
  const n = rnd(1,3);
  for(let i=0;i<n;i++){
    const action = pick(ACTIONS).padStart(11," ");
    const size = humanSize().padStart(9," ");
    appendLog(`[${action}] ${size}  ${randomPath(brand)}`);
  }
  logTimer = setTimeout(scheduleLogTick, rnd(100,250));
}

function updateProgress(){
  if(!isProcessing) return;
  const elapsed = Date.now() - startTs;
  const percent = Math.min(elapsed / totalMs * 100, 100);
  barFill.style.width = percent.toFixed(1) + "%";

  const remainMs = Math.max(totalMs - elapsed, 0);
  const m = Math.floor(remainMs / 60000);
  const s = Math.floor((remainMs % 60000) / 1000);
  statusEl.textContent =
    `Создание образа: ${brandSel.value} ${modelSel.value}\nПрогресс: ${percent.toFixed(1)}% | Осталось: ${pad2(m)}:${pad2(s)}`;

  if(percent >= 100) finishProcess();
}

function finishProcess(){
  isProcessing = false;
  clearInterval(progressTimer); progressTimer = null;
  clearTimeout(logTimer); logTimer = null;
  barFill.style.width = "100%";
  appendLog("[ DONE  ] Образ успешно создан (симуляция).");
  statusEl.textContent = "Процесс завершен. Файл-образ создан.";
  
  // Прячем кнопку отмены
  cancelBtn.style.display = "none";
  
  actionBtn.disabled = false;
  releaseWakeLock();
}

function abortProcess(){
  isProcessing = false;
  clearInterval(progressTimer); progressTimer = null;
  clearTimeout(logTimer); logTimer = null;
  barFill.style.width = "0%";
  appendLog("[ ОТМЕНА ] Процесс прерван пользователем.");
  appendLog("[ ОЧИСТКА ] Все временные данные удалены.");
  statusEl.textContent = "Копирование отменено. Данные удалены.";
  
  // Прячем кнопку отмены
  cancelBtn.style.display = "none";
  
  actionBtn.disabled = false;
  releaseWakeLock();
}

/* ---------- Защита от закрытия ---------- */
window.addEventListener("beforeunload", (e)=>{
  if(isProcessing){
    e.preventDefault();
    e.returnValue = "";
  }
});
</script>
